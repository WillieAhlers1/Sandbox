# Cloud Build config for GCP ML Framework.
# Usage: gcloud builds submit --config cloudbuild.yaml \
#   --substitutions _TAG=...,_PIPELINE=...,_AR_REPO=...
#
# Cache strategy: pull :latest → build with --cache-from → push :latest + :{tag}
# Cloud Build steps share a Docker daemon, so step 1 output is available in step 3.

steps:
  # Step 0: Pull cached base-python (ignore if first build)
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args: ["-c", "docker pull ${_AR_REPO}/base-python:latest || true"]

  # Step 1: Build base-python
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_AR_REPO}/base-python:${_TAG}"
      - "-t"
      - "${_AR_REPO}/base-python:latest"
      - "--cache-from"
      - "${_AR_REPO}/base-python:latest"
      - "-f"
      - "docker/base/base-python/Dockerfile"
      - "docker/base/base-python"

  # Step 2: Push base-python (explicit push runs under --service-account SA)
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "${_AR_REPO}/base-python"]

  # Step 3: Pull cached pipeline image (ignore if first build)
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args: ["-c", "docker pull ${_AR_REPO}/${_PIPELINE}:latest || true"]

  # Step 4: Build pipeline image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_AR_REPO}/${_PIPELINE}:${_TAG}"
      - "-t"
      - "${_AR_REPO}/${_PIPELINE}:latest"
      - "--cache-from"
      - "${_AR_REPO}/${_PIPELINE}:latest"
      - "--build-arg"
      - "BASE_IMAGE=${_AR_REPO}/base-python:${_TAG}"
      - "-f"
      - "docker/pipeline/Dockerfile"
      - "."

  # Step 5: Push pipeline image
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "${_AR_REPO}/${_PIPELINE}"]

substitutions:
  _TAG: "latest"
  _PIPELINE: "training-pipeline"
  _AR_REPO: ""

options:
  machineType: "E2_HIGHCPU_8"
  logging: "CLOUD_LOGGING_ONLY"
