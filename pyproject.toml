[project]
name = "second-run"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
    # Change: Move loguru and typer to core dependencies
    "loguru>=0.7.3",
    "pydantic>=2.9",
    "typer>=0.15",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "pyarrow>=18",
    "pandas>=2.2",
    "db-dtypes>=1.4.4",
]

[project.optional-dependencies]
components = [
    "kfp>=2.15,<3",
    "google-cloud-aiplatform>=1.136",
    "google-cloud-secret-manager>=2.21",
    "scikit-learn>=1.4",
    "typer>=0.15",
    "rich>=13",
]
trainer = [
    "scikit-learn>=1.5",
    "typer>=0.15",
    "numpy>=1.26",
]
dev = [
    "apache-airflow>=2.10",
    "apache-airflow-providers-google>=20.0",
    "duckdb>=1.1",
]

[project.scripts]
gml = "gcp_ml_framework.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
